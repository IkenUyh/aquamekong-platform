name: AquaMekong CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Backend
        working-directory: backend-springboot
        run: ./mvnw clean package -DskipTests -B

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build
        working-directory: frontend
        run: |
          npm install
          npm run build

  ml-service:
    name: ML Service Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: Verify imports
        working-directory: ml-service
        run: python -c "from app.main import app; print('ML Service OK')"

  docker:
    name: Docker Compose Verify
    runs-on: ubuntu-latest
    needs: [backend, frontend, ml-service]
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose config
        run: docker compose config
