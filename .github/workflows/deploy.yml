name: AquaMekong CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Backend
        working-directory: backend-springboot
        run: ./mvnw -B verify

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  ml-service:
    name: ML Service Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements*.txt

      - name: Install dependencies (torch CPU)
        working-directory: ml-service
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
          pip install -r requirements-dev.txt

      - name: Test
        working-directory: ml-service
        run: python -m pytest -q tests

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, ml-service]
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose config
        run: docker compose config -q

      - name: Build images
        run: docker compose build
