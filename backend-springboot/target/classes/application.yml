# ============================================
# AquaMekong Backend — Application Configuration
# ============================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aquamekong-backend

  # --- Database (PostgreSQL + PostGIS) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aquamekong}
    username: ${DB_USERNAME:aquamekong}
    password: ${DB_PASSWORD:aquamekong_secret}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# --- Logging ---
logging:
  level:
    com.aquamekong: DEBUG
    org.hibernate.SQL: INFO
    org.flywaydb: INFO

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# --- Custom App Properties ---
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
  telemetry:
    broadcast-interval-ms: ${TELEMETRY_INTERVAL:10000}
