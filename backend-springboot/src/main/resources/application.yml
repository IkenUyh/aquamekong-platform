# ============================================
# AquaMekong Backend — Application Configuration
# ============================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aquamekong-backend

  # --- Database (PostgreSQL + PostGIS) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aquamekong}
    username: ${DB_USERNAME:aquamekong}
    password: ${DB_PASSWORD:aquamekong_secret}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Gộp các lazy-load (station, sensor, run...) thành batch IN (...) để tránh N+1
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# --- Logging ---
logging:
  level:
    com.aquamekong: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: INFO
    org.flywaydb: INFO

# --- Actuator: chỉ health cho Docker healthcheck ---
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# --- Custom App Properties ---
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
  telemetry:
    broadcast-interval-ms: ${TELEMETRY_INTERVAL:10000}
  security:
    jwt:
      # >= 32 ký tự. Để trống: sinh ngẫu nhiên mỗi lần khởi động (token mất hiệu lực khi restart)
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:8h}
    # Header X-API-Key cho thiết bị IoT gọi /measurements/ingest. Để trống = tắt
    ingest-api-key: ${INGEST_API_KEY:}
    # Người chưa đăng nhập được xem bản đồ, số đo, dự báo, cảnh báo, báo cáo (chỉ đọc)
    public-read: ${PUBLIC_READ_ENABLED:true}
    # Cho phép tự đăng ký (mật khẩu hoặc Google). Tài khoản tự đăng ký chỉ có ROLE_USER
    registration-enabled: ${REGISTRATION_ENABLED:true}
    google:
      # OAuth Client ID (loại Web application) từ Google Cloud Console. Trống = tắt đăng nhập Google
      client-id: ${GOOGLE_CLIENT_ID:}
    zalo:
      # https://developers.zalo.me -> Ứng dụng -> Đăng nhập. Thiếu một trong hai = tắt đăng nhập Zalo
      app-id: ${ZALO_APP_ID:}
      app-secret: ${ZALO_APP_SECRET:}
    webauthn:
      # Tên miền (không có scheme/port) mà passkey gắn vào, vd. aquamekong.vn. Trống = tắt passkey.
      # Đổi rp-id sau này thì các passkey đã tạo không dùng được nữa
      rp-id: ${WEBAUTHN_RP_ID:localhost}
      # Origin đầy đủ mà trình duyệt mở trang (scheme + host + port), cách nhau dấu phẩy
      origins: ${WEBAUTHN_ORIGINS:http://localhost:3000,http://localhost:5173}
    bootstrap-admin:
      username: ${ADMIN_USERNAME:admin}
      email: ${ADMIN_EMAIL:admin@aquamekong.local}
      # Để trống: sinh mật khẩu ngẫu nhiên và in ra log một lần khi tạo admin
      password: ${ADMIN_PASSWORD:}
