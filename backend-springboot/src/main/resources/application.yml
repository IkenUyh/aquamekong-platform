# ============================================
# AquaMekong Backend — Application Configuration
# ============================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aquamekong-backend

  # Mặc định chỉ 1 luồng @Scheduled: job dự báo hằng ngày (vài phút) sẽ chặn MeasurementPoller
  task:
    scheduling:
      pool:
        size: 4

  # --- Database (PostgreSQL + PostGIS) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aquamekong}
    username: ${DB_USERNAME:aquamekong}
    password: ${DB_PASSWORD:aquamekong_secret}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Gộp các lazy-load (station, sensor, run...) thành batch IN (...) để tránh N+1
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# --- Logging ---
logging:
  level:
    com.aquamekong: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: INFO
    org.flywaydb: INFO

# --- Actuator: chỉ health cho Docker healthcheck ---
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# --- Custom App Properties ---
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,https://localhost,http://localhost,capacitor://localhost}
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
  # Dự báo cho mọi trạm mỗi sáng (giờ VN), sau khi dữ liệu RYNAN về lúc ~06:00. "-" = tắt
  forecast:
    daily-cron: ${FORECAST_DAILY_CRON:0 30 7 * * *}
  # Sau giờ hẹn (giờ VN) mà chưa có số đo của hôm qua thì coi là dữ liệu trễ: trang Tổng quan hiện cảnh báo,
  # và lúc check-cron gửi thông báo cho Quản trị/Vận hành. "-" = tắt thông báo (trang Tổng quan vẫn hiện)
  freshness:
    expected-by: ${FRESHNESS_EXPECTED_BY:09:00}
    check-cron: ${FRESHNESS_CHECK_CRON:0 0 9 * * *}
  telemetry:
    broadcast-interval-ms: ${TELEMETRY_INTERVAL:10000}
    # Số đo cũ hơn mốc này (nạp dữ liệu lịch sử) không tạo cảnh báo, không đẩy SSE
    max-live-age: ${TELEMETRY_MAX_LIVE_AGE:P3D}
  # Thông báo đẩy khi có cảnh báo mới
  push:
    vapid:
      # Web Push cho trình duyệt. Tạo cặp khoá: npx web-push generate-vapid-keys. Trống = tắt
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      # Liên hệ của người vận hành, dịch vụ push dùng khi có sự cố (mailto: hoặc https:)
      subject: ${VAPID_SUBJECT:mailto:admin@aquamekong.local}
    fcm:
      # App điện thoại: base64 của file JSON service account Firebase. Trống = tắt
      service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
  security:
    jwt:
      # >= 32 ký tự. Để trống: sinh ngẫu nhiên mỗi lần khởi động (token mất hiệu lực khi restart)
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:8h}
    # Header X-API-Key cho thiết bị IoT gọi /measurements/ingest. Để trống = tắt
    ingest-api-key: ${INGEST_API_KEY:}
    # Người chưa đăng nhập được xem bản đồ, số đo, dự báo, cảnh báo, báo cáo (chỉ đọc)
    public-read: ${PUBLIC_READ_ENABLED:true}
    # Cho phép tự đăng ký (mật khẩu hoặc Google). Tài khoản tự đăng ký chỉ có ROLE_USER
    registration-enabled: ${REGISTRATION_ENABLED:true}
    google:
      # OAuth Client ID (loại Web application) từ Google Cloud Console. Trống = tắt đăng nhập Google
      client-id: ${GOOGLE_CLIENT_ID:}
    zalo:
      # https://developers.zalo.me -> Ứng dụng -> Đăng nhập. Thiếu một trong hai = tắt đăng nhập Zalo
      app-id: ${ZALO_APP_ID:}
      app-secret: ${ZALO_APP_SECRET:}
    webauthn:
      # Tên miền (không có scheme/port) mà passkey gắn vào, vd. aquamekong.vn. Trống = tắt passkey.
      # Đổi rp-id sau này thì các passkey đã tạo không dùng được nữa
      rp-id: ${WEBAUTHN_RP_ID:localhost}
      # Origin đầy đủ mà trình duyệt mở trang (scheme + host + port), cách nhau dấu phẩy
      origins: ${WEBAUTHN_ORIGINS:http://localhost:3000,http://localhost:5173}
    bootstrap-admin:
      username: ${ADMIN_USERNAME:admin}
      email: ${ADMIN_EMAIL:admin@aquamekong.local}
      # Để trống: sinh mật khẩu ngẫu nhiên và in ra log một lần khi tạo admin
      password: ${ADMIN_PASSWORD:}
