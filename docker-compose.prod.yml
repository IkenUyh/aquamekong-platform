# ============================================
# Production (EC2): ghép đè lên docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Server không build: image do GitHub Actions build sẵn và đẩy lên GHCR (xem deploy/README.md).
# Chỉ Caddy mở cổng ra ngoài (80/443, HTTPS tự động); các service khác chỉ nằm trong mạng docker.
# ============================================
services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    image: ghcr.io/ikenuyh/aquamekong-backend:${IMAGE_TAG:-latest}
    ports: !reset []
    environment:
      # Máy 2 GB chạy chung cả stack: giới hạn heap thay vì 75% RAM của máy (~1,5 GB)
      JAVA_OPTS: -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError

  ml-service:
    image: ghcr.io/ikenuyh/aquamekong-ml-service:${IMAGE_TAG:-latest}
    ports: !reset []

  frontend:
    image: ghcr.io/ikenuyh/aquamekong-frontend:${IMAGE_TAG:-latest}
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: aquamekong-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Đặt DOMAIN trong .env, vd. aquamekong.kienhuy-dev.name.vn}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Chứng chỉ Let's Encrypt: giữ qua các lần deploy để không xin lại (Let's Encrypt giới hạn số lần cấp)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - aquamekong-network

volumes:
  caddy_data:
  caddy_config:
